<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S egredo </title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,600&family=Lora:ital,wght@0,400;1,300;1,400&family=Dancing+Script:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  font-family: 'Lora', serif;
  background: #000;
}

/* ══════════════════════════════
   LOGIN SCREEN
══════════════════════════════ */
#login-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  transition: opacity 1.4s ease, transform 1.4s ease;
}

#login-screen.fade-out {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}

.login-card {
  position: relative;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255, 200, 80, 0.2);
  border-radius: 20px;
  padding: 52px 48px 44px;
  width: min(420px, 90vw);
  backdrop-filter: blur(24px);
  box-shadow:
    0 0 60px rgba(180,100,255,0.08),
    0 20px 60px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,200,255,0.12);
  animation: cardIn 1s cubic-bezier(.22,1,.36,1) both;
  z-index: 2;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

.login-icon {
  text-align: center;
  font-size: 2.4rem;
  margin-bottom: 6px;
  animation: pulse-icon 3s ease-in-out infinite;
}

@keyframes pulse-icon {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.12); }
}

.login-title {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.55rem;
  color: #f0d0ff;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}

.login-subtitle {
  font-size: 0.78rem;
  color: rgba(200,160,230,0.5);
  text-align: center;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 38px;
}

.field-group { margin-bottom: 22px; }

.field-group label {
  display: block;
  font-size: 0.82rem;
  color: rgba(220,180,255,0.8);
  letter-spacing: 0.5px;
  margin-bottom: 9px;
  font-style: italic;
}

.field-group input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(200,150,255,0.2);
  border-radius: 10px;
  padding: 13px 16px;
  color: #f5eaff;
  font-family: 'Lora', serif;
  font-size: 0.97rem;
  outline: none;
  transition: border-color .3s, box-shadow .3s, background .3s;
}

.field-group input::placeholder { color: rgba(200,160,255,0.22); }

.field-group input:focus {
  border-color: rgba(200,150,255,0.5);
  background: rgba(255,255,255,0.08);
  box-shadow: 0 0 0 3px rgba(180,100,255,0.1);
}

.error-msg {
  font-size: 0.78rem;
  color: #ff9090;
  font-style: italic;
  margin-top: 6px;
  min-height: 18px;
  transition: opacity .3s;
  opacity: 0;
}
.error-msg.show { opacity: 1; }

.btn-enter {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  background: linear-gradient(135deg, #7b2fff 0%, #c060ff 50%, #7b2fff 100%);
  background-size: 200% 200%;
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  animation: shimmer 3s linear infinite;
}

@keyframes shimmer {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.btn-enter:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(160,80,255,0.45);
}
.btn-enter:active { transform: translateY(0); }

.login-footer {
  text-align: center;
  margin-top: 28px;
  font-size: 0.72rem;
  color: rgba(180,140,220,0.3);
  letter-spacing: 1.5px;
}

/* ══════════════════════════════
   STARRY SKY SCENE
══════════════════════════════ */
#scene {
  position: fixed; inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.8s ease 0.4s;
}
#scene.visible {
  opacity: 1;
  pointer-events: all;
}

canvas#sky {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
}

.moon {
  position: fixed;
  top: 6%;
  right: 8%;
  width: clamp(70px, 10vw, 110px);
  height: clamp(70px, 10vw, 110px);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%,
    #fffde7 0%, #fff9c4 30%, #f5e663 60%, #e6c800 100%);
  box-shadow:
    0 0 30px rgba(255,240,100,0.4),
    0 0 80px rgba(255,220,50,0.2),
    0 0 150px rgba(255,200,0,0.1);
  animation: moonGlow 4s ease-in-out infinite alternate;
  opacity: 0;
  transition: opacity 1.5s ease 1s;
  pointer-events: none;
  z-index: 2;
}
.moon.visible { opacity: 1; }

@keyframes moonGlow {
  from { box-shadow: 0 0 30px rgba(255,240,100,0.4), 0 0 80px rgba(255,220,50,0.2); }
  to   { box-shadow: 0 0 50px rgba(255,240,100,0.6), 0 0 120px rgba(255,220,50,0.35); }
}

/* Shooting star messages */
.message-container {
  position: fixed; inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 3;
}

.love-message {
  position: absolute;
  font-family: 'Dancing Script', cursive;
  font-size: clamp(14px, 2.2vw, 22px);
  color: #fff;
  text-shadow:
    0 0 8px rgba(255,200,255,0.9),
    0 0 20px rgba(220,150,255,0.7),
    0 0 40px rgba(180,100,255,0.5);
  white-space: nowrap;
  opacity: 0;
  letter-spacing: 2px;
  animation: fadeMessage 2.8s ease-out forwards;
  pointer-events: none;
}

@keyframes fadeMessage {
  0%   { opacity: 0; transform: translateY(0) scale(0.8); }
  20%  { opacity: 1; transform: translateY(-10px) scale(1); }
  70%  { opacity: 1; transform: translateY(-30px) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(0.95); }
}

/* Bottom title */
.scene-title {
  position: fixed;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(0.95rem, 2vw, 1.25rem);
  color: rgba(220,190,255,0.7);
  letter-spacing: 2px;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 0 20px rgba(180,100,255,0.4);
  opacity: 0;
  transition: opacity 1.5s ease 2s;
  z-index: 2;
  pointer-events: none;
}
.scene-title.visible { opacity: 1; }
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <!-- Sky canvas behind the card too -->
  <canvas id="sky-login" style="position:absolute;inset:0;width:100%;height:100%;z-index:0;"></canvas>

  <div class="login-card">
    <div class="login-icon">✨</div>
    <h1 class="login-title">Um lugar só nosso</h1>
    <p class="login-subtitle">acesso restrito ✦</p>

    <div class="field-group">
      <label for="inp-name">Seu nome:</label>
      <input id="inp-name" type="text" placeholder="Quem é você?" autocomplete="off" spellcheck="false">
    </div>

    <div class="field-group">
      <label for="inp-pass">Senha <em style="font-size:.78rem;opacity:.7">(nome do amor da sua vida):</em></label>
      <input id="inp-pass" type="password" placeholder="••••••••" autocomplete="off">
      <p class="error-msg" id="err-msg">Nome ou senha incorretos. Tente de novo 🌙</p>
    </div>

    <button class="btn-enter" id="btn-enter">Entrar ✦</button>
    <p class="login-footer">feito com amor · só para você</p>
  </div>
</div>

<!-- ── SCENE ── -->
<div id="scene">
  <canvas id="sky"></canvas>
</div>

<div class="moon" id="moon"></div>
<div class="message-container" id="msgContainer"></div>
<p class="scene-title" id="sceneTitle">Obrigado por me amar durante esses 14 meses, xuinha!</p>

<script>
// ── AUTH ─────────────────────────────────────────────────
const VALID_NAMES = ['julia','júlia','xuia'];
const VALID_PASS  = ['josé','jose','jogério','jogerio','xugelio'];

function normalize(s) {
  return s.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

document.getElementById('btn-enter').addEventListener('click', tryLogin);
document.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

function tryLogin() {
  const name = normalize(document.getElementById('inp-name').value);
  const pass = normalize(document.getElementById('inp-pass').value);
  const err  = document.getElementById('err-msg');

  if (VALID_NAMES.includes(name) && VALID_PASS.includes(pass)) {
    err.classList.remove('show');
    startScene();
  } else {
    err.classList.add('show');
    document.getElementById('inp-pass').value = '';
    const card = document.querySelector('.login-card');
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = 'shake .4s ease';
  }
}

const shakeStyle = document.createElement('style');
shakeStyle.textContent = `@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}}`;
document.head.appendChild(shakeStyle);

// ── SKY ENGINE (shared, runs on whichever canvas is active) ──
let skyCtx, skyW, skyH;
let skyT = 0;
let activeCanvas = null;

const NUM_STARS = 340;
const stars = Array.from({ length: NUM_STARS }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.4 + 0.3,
  alpha: Math.random() * 0.6 + 0.3,
  speed: Math.random() * 0.008 + 0.003,
  phase: Math.random() * Math.PI * 2,
  color: ['#ffffff','#ffe4ff','#e4e4ff','#fff5cc','#d4f0ff'][Math.floor(Math.random()*5)],
}));

const shooters = [];
let lastSpawn = 0;
let shootingActive = false;

function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${Math.max(0,a).toFixed(3)})`;
}

function drawSkyBg() {
  const g = skyCtx.createRadialGradient(skyW*.5, skyH*.15, 0, skyW*.5, skyH*.5, skyH);
  g.addColorStop(0,  '#0a0018');
  g.addColorStop(0.4,'#050010');
  g.addColorStop(1,  '#000005');
  skyCtx.fillStyle = g;
  skyCtx.fillRect(0, 0, skyW, skyH);
}

function drawNebula() {
  const g = skyCtx.createLinearGradient(skyW*.1, skyH*.1, skyW*.9, skyH*.8);
  g.addColorStop(0,  'rgba(80,0,120,0)');
  g.addColorStop(.3, 'rgba(60,0,100,0.04)');
  g.addColorStop(.5, 'rgba(100,20,160,0.06)');
  g.addColorStop(.7, 'rgba(60,10,120,0.04)');
  g.addColorStop(1,  'rgba(80,0,120,0)');
  skyCtx.fillStyle = g;
  skyCtx.fillRect(0, 0, skyW, skyH);
}

function drawStars() {
  stars.forEach(s => {
    const a = s.alpha * (0.6 + 0.4 * Math.sin(skyT * s.speed + s.phase));
    skyCtx.beginPath();
    skyCtx.arc(s.x * skyW, s.y * skyH, s.r, 0, Math.PI*2);
    skyCtx.fillStyle = hexAlpha(s.color, a);
    skyCtx.fill();
  });
}

function spawnShooter() {
  const angle = (Math.random()*30+20)*Math.PI/180;
  const speed = Math.random()*6+5;
  const length = Math.random()*160+80;
  shooters.push({
    x: Math.random()*skyW*.85,
    y: Math.random()*skyH*.45,
    vx: Math.cos(angle)*speed,
    vy: Math.sin(angle)*speed,
    length, alpha:1, trail:[], life:0,
    maxLife: length/speed+20,
    color: ['#ffffff','#e0d0ff','#ffd0ff','#d0e8ff'][Math.floor(Math.random()*4)],
    msgSpawned: false,
  });
}

function drawShooters() {
  for (let i = shooters.length-1; i>=0; i--) {
    const s = shooters[i];
    s.trail.push({x:s.x, y:s.y});
    if (s.trail.length > 22) s.trail.shift();
    s.x += s.vx; s.y += s.vy; s.life++;
    const progress = s.life/s.maxLife;
    s.alpha = progress < .7 ? 1 : 1-(progress-.7)/.3;

    for (let j=0; j<s.trail.length-1; j++) {
      const t2 = j/s.trail.length;
      skyCtx.beginPath();
      skyCtx.moveTo(s.trail[j].x, s.trail[j].y);
      skyCtx.lineTo(s.trail[j+1].x, s.trail[j+1].y);
      skyCtx.strokeStyle = hexAlpha(s.color, s.alpha*t2*0.9);
      skyCtx.lineWidth = t2*2.5;
      skyCtx.lineCap = 'round';
      skyCtx.stroke();
    }

    const gg = skyCtx.createRadialGradient(s.x,s.y,0,s.x,s.y,6);
    gg.addColorStop(0, hexAlpha('#ffffff', s.alpha));
    gg.addColorStop(1, hexAlpha(s.color, 0));
    skyCtx.beginPath();
    skyCtx.arc(s.x,s.y,6,0,Math.PI*2);
    skyCtx.fillStyle = gg;
    skyCtx.fill();

    if (!s.msgSpawned && s.trail.length > 8 && shootingActive) {
      spawnMessage(s.trail[0].x, s.trail[0].y);
      s.msgSpawned = true;
    }
    if (s.life > s.maxLife || s.x > skyW+50 || s.y > skyH+50) shooters.splice(i,1);
  }
}

function spawnMessage(x, y) {
  const container = document.getElementById('msgContainer');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'love-message';
  el.textContent = '✦ eu te amo, xuia ✦';
  el.style.left = Math.min(Math.max(x-10,10), skyW-280)+'px';
  el.style.top  = Math.min(Math.max(y+8,10), skyH-60)+'px';
  el.style.fontSize = (Math.random()*6+14)+'px';
  const hue = Math.random()*60+270;
  el.style.color = `hsl(${hue},100%,90%)`;
  el.style.textShadow = `0 0 8px hsl(${hue},100%,80%), 0 0 25px hsl(${hue},80%,70%), 0 0 50px hsl(${hue},70%,50%)`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function skyLoop(ts) {
  skyT++;
  if (!skyCtx) { requestAnimationFrame(skyLoop); return; }

  skyCtx.clearRect(0,0,skyW,skyH);
  drawSkyBg();
  drawNebula();
  drawStars();
  drawShooters();

  if (shootingActive && ts - lastSpawn > 1400+Math.random()*1600) {
    spawnShooter();
    lastSpawn = ts;
  }

  requestAnimationFrame(skyLoop);
}

function attachCanvas(canvasEl) {
  skyCtx = canvasEl.getContext('2d');
  skyW = canvasEl.width  = window.innerWidth;
  skyH = canvasEl.height = window.innerHeight;
  window.addEventListener('resize', () => {
    skyW = canvasEl.width  = window.innerWidth;
    skyH = canvasEl.height = window.innerHeight;
  });
}

// Start on login canvas
attachCanvas(document.getElementById('sky-login'));
requestAnimationFrame(skyLoop);

// Kick a couple of shooters right away (no messages yet)
spawnShooter();
setTimeout(spawnShooter, 700);

// ── SCENE TRANSITION ─────────────────────────────────────
function startScene() {
  const loginScreen = document.getElementById('login-screen');
  loginScreen.classList.add('fade-out');

  // Switch canvas target after transition
  setTimeout(() => {
    loginScreen.style.display = 'none';
    const sceneCanvas = document.getElementById('sky');
    attachCanvas(sceneCanvas);

    document.getElementById('scene').classList.add('visible');
    document.getElementById('moon').classList.add('visible');
    document.getElementById('sceneTitle').classList.add('visible');

    // Enable shooting star messages
    shootingActive = true;
    spawnShooter();
    setTimeout(spawnShooter, 600);
  }, 1200);
}
</script>
</body>
</html>
